server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    types {
        model/gltf-binary             glb;
        model/gltf+json               gltf;
        text/html                     html;
        text/css                      css;
        application/javascript        js;
        audio/mpeg                    mp3;
        video/mp4                     mp4;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript model/gltf-binary;
}
