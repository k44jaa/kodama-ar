server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects (such as /assets to /assets/) as relative paths, so they stay
    # right behind the HTTPS proxy in front of the container.
    absolute_redirect off;

    # The image's list of file types, plus the 3D models it does not know.
    # (A types block on its own would replace the whole list.)
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    location / {
        # A missing file is a 404, not index.html: a model that fails to load
        # then shows up as such in the browser console.
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript model/gltf-binary model/gltf+json;
}
