<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Space - Kodama AR</title>

  <!-- A-Frame & Extras Bibliotheken -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Skript für autonome AR-Logik -->
  <script src="./app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Start-Overlay (Löst Browser-Autoplay & WebXR-Kameraberechtigungen) */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 15, 0.9);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #start-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
      margin-top: 24px;
      transition: transform 0.1s ease;
    }

    #start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Start-Bildschirm -->
  <div id="overlay">
    <h1 style="margin-bottom: 8px;">Kodama AR</h1>
    <p style="opacity: 0.9; max-width: 320px; line-height: 1.5;">
      Blicke beim Starten bitte geradeaus in den Raum.<br>
      <small style="opacity: 0.7;">(Stummschalter am Smartphone ausschalten)</small>
    </p>
    <button id="start-btn">✨ AR-Erlebnis starten</button>
  </div>

  <!-- A-Frame AR-Szene -->
  <a-scene 
    webxr="optionalFeatures: hit-test, ar-modes; referenceSpaceType: local"
    vr-mode-ui="enabled: false"
    magic-forest>

    <a-assets>
      <!-- Verknüpfung mit deinem aktuellen 3D-Modell kodama_03.glb -->
      <a-asset-item id="kodama-model" src="./assets/kodama_03.glb"></a-asset-item>
    </a-assets>

    <!-- Kamera auf Augenhöhe -->
    <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    // Audio initialisieren (sanft und leise auf 20%)
    const kodamaSound = new Audio('./assets/Sound.mp3');
    kodamaSound.loop = true;
    kodamaSound.volume = 0.20;

    document.querySelector('#start-btn').addEventListener('click', function() {
      let scene = document.querySelector('a-scene');

      // 1. Audio direkt synchron beim Touch-Event starten
      kodamaSound.play().then(() => {
        console.log("Audio erfolgreich gestartet.");
      }).catch(err => {
        console.log("Audio-Status:", err);
      });

      // 2. Overlay ausblenden
      document.querySelector('#overlay').style.display = 'none';

      // 3. AR-Kamera anfordern
      if (scene.enterAR) {
        scene.enterAR();
      } else if (scene.enterVR) {
        scene.enterVR();
      }
    });
  </script>

</body>
</html>
