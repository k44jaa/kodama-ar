<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Space - Kodama AR</title>

  <!-- A-Frame & Extras Bibliotheken -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Deine Logik-Datei -->
  <script src="./app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Start-Overlay */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 15, 0.88);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #start-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
      margin-top: 24px;
    }

    #start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Start-Overlay -->
  <div id="overlay">
    <h1 style="margin-bottom: 8px;">Kodama AR</h1>
    <p style="opacity: 0.9; max-width: 320px; line-height: 1.4;">
      Blicke beim Starten bitte geradeaus in den Raum.<br>
      <small style="opacity: 0.7;">(Stummschalter am Handy bitte ausschalten)</small>
    </p>
    <button id="start-btn">✨ AR & Sound starten</button>
  </div>

  <!-- A-Frame AR-Szene -->
  <a-scene 
    webxr="optionalFeatures: hit-test, ar-modes; referenceSpaceType: local"
    vr-mode-ui="enabled: false"
    magic-forest>

    <a-assets>
      <a-asset-item id="kodama-model" src="./assets/kodama_01.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    // 2D-Audio mit der funktionierenden Datei (Sound.mp3)
    const kodamaSound = new Audio('./assets/sound.mp3');

    function playOrganicKodamaSound() {
      kodamaSound.currentTime = 0;
      kodamaSound.volume = 0.1 + Math.random() * 0.25;
      kodamaSound.play().catch(err => console.log("Audio Info:", err));

      let nextInterval = 4000 + Math.random() * 6000;
      setTimeout(playOrganicKodamaSound, nextInterval);
    }

    document.querySelector('#start-btn').addEventListener('click', function() {
      let scene = document.querySelector('a-scene');

      // 1. Audio-Schleife beim Button-Klick starten
      playOrganicKodamaSound();

      // 2. Overlay ausblenden
      document.querySelector('#overlay').style.display = 'none';

      // 3. AR-Kameramodus explizit anfordern (enterAR)
      if (scene.enterAR) {
        scene.enterAR();
      } else if (scene.enterVR) {
        scene.enterVR();
      }
    });
  </script>

</body>
</html>
