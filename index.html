<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Space - Kodama AR</title>

  <!-- A-Frame & Extras -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <!-- Deine Logik-Datei -->
  <script src="./app.js"></script>

  <style>
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 15, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Start-Overlay zum Entsperren von Audio & Kamera -->
  <div id="overlay">
    <h2>Willkommen im Creative Space</h2>
    <p>Blicke beim Starten geradeaus in den Raum.<br><small>(Stummschalter am Handy bitte ausschalten)</small></p>
    <button id="start-btn">✨ AR & Sound starten</button>
  </div>

  <!-- A-Frame AR-Szene mit Kamera-Stream -->
  <a-scene 
    webxr="optionalFeatures: hit-test, ar-modes; referenceSpaceType: local"
    magic-forest>

    <a-assets>
      <a-asset-item id="kodama-model" src="./assets/kodama_01.glb"></a-asset-item>
      <audio id="kodama-sound" src="./assets/sound.mp3" preload="auto" crossorigin="anonymous" loop></audio>
    </a-assets>

    <a-camera position="0 1.6 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    document.querySelector('#start-btn').addEventListener('click', function() {
      let scene = document.querySelector('a-scene');
      let audioEl = document.querySelector('#kodama-sound');

      // 1. Audio direkt durch den Nutzerklick freischalten
      if (audioEl) {
        audioEl.muted = false;
        audioEl.play().then(() => {
          console.log("Audio gestartet");
        }).catch(e => console.log("Audio Play Error:", e));
      }

      // 2. WebAudio Context in A-Frame reaktivieren
      if (scene.audioListener && scene.audioListener.context) {
        if (scene.audioListener.context.state === 'suspended') {
          scene.audioListener.context.resume();
        }
      }

      // 3. Overlay entfernen
      document.querySelector('#overlay').style.display = 'none';

      // 4. Standard A-Frame AR/VR Modus starten
      if (scene.enterVR) {
        scene.enterVR();
      }
    });
  </script>

</body>
</html>
