<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Space - Kodama AR Experience</title>

  <!-- WebXR Framework Libraries (copies in assets/vendor, see README there) -->
  <script src="./assets/vendor/aframe-1.4.2.min.js"></script>
  <script src="./assets/vendor/aframe-extras-6.1.1.min.js"></script>

  <!-- Autonomous AR Agent Core Engine -->
  <script src="./app.js?v=24"></script>

  <style>
    /* Yuji Boku & Quicksand, Latin characters, served from this site
       (assets/fonts) rather than from Google Fonts. */
    @font-face {
      font-family: 'Quicksand';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url(./assets/fonts/quicksand-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Yuji Boku';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(./assets/fonts/yuji-boku-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
      background-color: #000000;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #video-tint {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(10, 25, 18, 0.55) 0%, rgba(5, 15, 10, 0.82) 100%);
      z-index: 1;
    }

    #overlay-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
    }

    #overlay-content h1 {
      font-family: 'Yuji Boku', serif;
      font-size: 34px;
      font-weight: 400;
      margin: 0 0 14px 0;
      letter-spacing: 1.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.75);
    }

    #overlay-content p {
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
      margin: 0 0 24px 0;
      opacity: 0.92;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    #start-btn {
      background: #00674b;
      color: #ffffff;
      border: none;
      padding: 16px 36px;
      font-family: 'Yuji Boku', serif;
      font-size: 22px;
      letter-spacing: 1px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0, 103, 75, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #start-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- WebXR Entry & Audio Authorization Overlay -->
  <div id="overlay">
    <video id="bg-video" autoplay loop muted playsinline src="./assets/intro.mp4"></video>
    <div id="video-tint"></div>

    <div id="overlay-content">
      <h1>Creative Space Kodamas</h1>
      <p>
        Look straight ahead into the physical space upon starting.<br>
        <small style="opacity: 0.75; font-size: 13px;">(Tap entities to interact & ensure audio is unmuted)</small>
      </p>
      <button id="start-btn">🌳🪵Discover🪾🌲</button>
    </div>
  </div>

  <!-- A-Frame WebXR Scene Graph -->
  <a-scene 
    webxr="optionalFeatures: hit-test, ar-modes; referenceSpaceType: local"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    magic-forest="count: 6">

    <a-assets>
      <a-asset-item id="kodama-1" src="./assets/new_kodama_01.glb"></a-asset-item>
      <a-asset-item id="kodama-2" src="./assets/new_kodama_02.glb"></a-asset-item>
      <a-asset-item id="kodama-3" src="./assets/new_kodama_03.glb"></a-asset-item>
      <a-asset-item id="kodama-4" src="./assets/new_kodama_04.glb"></a-asset-item>
      <a-asset-item id="kodama-5" src="./assets/new_kodama_05.glb"></a-asset-item>
      <a-asset-item id="kodama-6" src="./assets/new_kodama_06.glb"></a-asset-item>
    </a-assets>

    <!-- Camera Node -->
    <a-camera id="main-camera" position="0 1.6 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    document.querySelector('#start-btn').addEventListener('click', function() {
      const scene = document.querySelector('a-scene');

      if (window.playKodamaSound) {
        window.playKodamaSound(0.05, 1.0);
      }

      const video = document.querySelector('#bg-video');
      if (video) video.pause();
      document.querySelector('#overlay').style.display = 'none';

      if (scene.enterAR) {
        scene.enterAR();
      } else if (scene.enterVR) {
        scene.enterVR();
      }
    });
  </script>

</body>
</html>
