# Builds the container image and publishes it as ghcr.io/k44jaa/kodama-ar.
# Pull requests are only built, to check that the image still builds.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so security fixes in the nginx base image get in even when
  # nothing in the repo changes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main is what the server runs; :sha-<commit> keeps each build
      # findable, to go back to an earlier one.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
